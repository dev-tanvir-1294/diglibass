<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGrad>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGrad>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#steelGrad)" rx="12" />

  <!-- Drop shadow -->
  <ellipse cx="400" cy="480" rx="120" ry="20" fill="url(#shadowGrad)" />

  <!-- Main Flange (front view) -->
  <g transform="translate(280, 200)">
    <!-- Outer rim -->
    <circle cx="120" cy="120" r="120" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="2" />
    <!-- Hole pattern (4 holes) -->
    <g stroke="#CBD5E1" stroke-width="8" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="70" />
      <line x1="120" y1="170" x2="120" y2="210" />
      <line x1="30" y1="120" x2="70" y2="120" />
      <line x1="170" y1="120" x2="210" y2="120" />
    </g>
    <!-- Inner bore -->
    <circle cx="120" cy="120" r="36" fill="#F8FAFC" />
    <!-- Bolt circle -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Side Profile Flange -->
  <g transform="translate(550, 250)" opacity="0.7">
    <!-- Flange profile -->
    <rect x="0" y="0" width="180" height="80" rx="4" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="1" />
    <rect x="0" y="0" width="20" height="80" fill="#CBD5E1" />
    <rect x="160" y="0" width="20" height="80" fill="#CBD5E1" />
    <!-- Raised face -->
    <rect x="15" y="15" width="150" height="20" fill="#E2E8F0" />
    <rect x="15" y="35" width="150" height="30" fill="#F1F5F9" />
    <!-- Pipe -->
    <rect x="30" y="-60" width="120" height="60" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="1" />
    <rect x="30" y="-60" width="120" height="20" fill="#F8FAFC" />
  </g>

  <!-- Small pipe sections -->
  <g transform="translate(100, 400)" opacity="0.6">
    <rect x="0" y="0" width="100" height="40" rx="2" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="1" />
    <rect x="0" y="0" width="20" height="40" fill="#CBD5E1" />
    <rect x="80" y="0" width="20" height="40" fill="#CBD5E1" />
  </g>

  <g transform="translate(620, 420)" opacity="0.5">
    <rect x="0" y="0" width="80" height="30" rx="2" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="1" />
    <rect x="0" y="0" width="15" height="30" fill="#CBD5E1" />
    <rect x="65" y="0" width="15" height="30" fill="#CBD5E1" />
  </g>
</svg>
